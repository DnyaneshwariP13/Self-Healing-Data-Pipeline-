name: airflow

services:

  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  redis:
    image: redis:7.2-bookworm
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
    restart: always

  airflow-init:
    image: apache/airflow:3.0.6
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e

        echo "=========================================="
        echo "Initializing Apache Airflow"
        echo "=========================================="

        echo "Running database migration..."
        airflow db migrate

        echo "Creating Airflow admin user..."
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email airflow@example.com || true

        echo "=========================================="
        echo "Airflow version:"
        airflow version
        echo "=========================================="

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: "ollama"
      OLLAMA_HOST: "http://host.docker.internal:11434"
      AIRFLOW__API_AUTH__JWT_ISSUER: airflow
      AIRFLOW__API_AUTH__JWT_SECRET: airflow_jwt_secret
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    user: "0:0"

    volumes:
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\airflow
        target: /sources

  airflow-api-server:
    image: apache/airflow:3.0.6
    command: api-server

    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: ""
      AIRFLOW__API_AUTH__JWT_ISSUER: airflow
      AIRFLOW__API_AUTH__JWT_SECRET: airflow_jwt_secret
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always
    user: "50000:0"

    volumes:
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\dags
        target: /opt/airflow/dags
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\airflow\logs
        target: /opt/airflow/logs
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\airflow\plugins
        target: /opt/airflow/plugins
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\input
        target: /opt/airflow/input
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\output
        target: /opt/airflow/output

  airflow-dag-processor:
    image: apache/airflow:3.0.6
    command: dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: ""
      AIRFLOW__API_AUTH__JWT_ISSUER: airflow
      AIRFLOW__API_AUTH__JWT_SECRET: airflow_jwt_secret
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always
    user: "50000:0"

    volumes:
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\dags
        target: /opt/airflow/dags
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\airflow\logs
        target: /opt/airflow/logs
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\airflow\plugins
        target: /opt/airflow/plugins
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\input
        target: /opt/airflow/input

  airflow-scheduler:
    image: apache/airflow:3.0.6
    command: scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: ""
      AIRFLOW__API_AUTH__JWT_ISSUER: airflow
      AIRFLOW__API_AUTH__JWT_SECRET: airflow_jwt_secret
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always
    user: "50000:0"

    volumes:
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\dags
        target: /opt/airflow/dags
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\airflow\logs
        target: /opt/airflow/logs
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\airflow\plugins
        target: /opt/airflow/plugins
      - type: bind  
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\input
        target: /opt/airflow/input
  airflow-triggerer:
    image: apache/airflow:3.0.6
    command: triggerer

    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: ""
      AIRFLOW__API_AUTH__JWT_ISSUER: airflow
      AIRFLOW__API_AUTH__JWT_SECRET: airflow_jwt_secret
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always
    user: "50000:0"

    volumes:
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\dags
        target: /opt/airflow/dags
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\airflow\logs
        target: /opt/airflow/logs
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\airflow\plugins
        target: /opt/airflow/plugins
      - type: bind  
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\input
        target: /opt/airflow/input

  airflow-worker:
    image: apache/airflow:3.0.6
    command:
      - celery
      - worker

    depends_on:
      airflow-api-server:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: "ollama"
      OLLAMA_HOST: http://host.docker.internal:11434
      AIRFLOW__API_AUTH__JWT_ISSUER: airflow
      AIRFLOW__API_AUTH__JWT_SECRET: airflow_jwt_secret
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
