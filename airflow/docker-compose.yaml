      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      DUMB_INIT_SETSID: "0"

    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d \"celery@$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always
    user: "50000:0"

    volumes:
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\dags
        target: /opt/airflow/dags
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\airflow\logs
        target: /opt/airflow/logs
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\airflow\plugins
        target: /opt/airflow/plugins
      - type: bind    
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\input
        target: /opt/airflow/input
      - type: bind
        source: C:\Users\dnyap\OneDrive\Desktop\SelfHealingDataPipeline\output
        target: /opt/airflow/output
volumes:
  postgres-db-volume:
    name: airflow_postgres-db-volume